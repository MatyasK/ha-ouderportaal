name: Release

# Publishes a GitHub release for the version in manifest.json, so HACS offers it as an update.
# Run it from main after the version bump is merged and Validate passed.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version custom_components/ouderportaal/manifest.json)
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --generate-notes
