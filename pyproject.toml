[project]
name = "ha-ouderportaal"
# Required by uv; the integration's version is in custom_components/ouderportaal/manifest.json.
version = "0"
description = "Home Assistant integration for Konnect ouderportaal daycare portals"
requires-python = ">=3.13"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
